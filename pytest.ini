[pytest]
# importlib mode gives every test module its own identity, so two skills may
# ship tests with the same basename without colliding at collection time.
# It requires that no test module import another; shared fixtures and builders
# live in _tooling_fixtures.py / _context_fixtures.py instead.
addopts = --import-mode=importlib
pythonpath = tooling
testpaths = tooling/tests skills
