[project]
name = "cometweb-agent-skills"
version = "2.0.1"
description = "CometWeb Labs specialist skills for research, product operations, quality workflows, QA, release readiness, and evidence-based decisions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Skills themselves are data + scripts; Python deps are for tooling/tests only.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "ruff>=0.16",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.uv]
package = false
