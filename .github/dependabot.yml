version: 2
updates:
  # The pinned action versions in validate.yml are a supply-chain surface; a
  # stale checkout or setup-python action is the kind of thing nobody notices
  # until it breaks or is deprecated.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"

  # Dev dependencies only; this repository ships no runtime package.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
