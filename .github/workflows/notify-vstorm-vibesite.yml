# Tell vstorm-co/vstorm-vibesite to re-sync its mirror of skills/ai-humanize
# (.claude/skills/ai-humanize there, via its sync-ai-humanize.yml) right after a push here.
# Needs the secret VSTORM_VIBESITE_DISPATCH_TOKEN: a fine-grained token limited to
# vstorm-co/vstorm-vibesite with "Contents: read and write". Without it the job is skipped and the
# Vstorm side still syncs once a day.
name: Notify vstorm-vibesite (ai-humanize)

on:
  push:
    branches: [main]
    paths:
      - "skills/ai-humanize/**"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          TOKEN: ${{ secrets.VSTORM_VIBESITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::VSTORM_VIBESITE_DISPATCH_TOKEN is not set; vstorm-vibesite will pick the change up in its daily sync."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vstorm-co/vstorm-vibesite/dispatches \
            -d "{\"event_type\":\"sync-ai-humanize\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
