name: Attest packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  platforms:
    uses: ./.github/workflows/platform-matrix.yml

  attest:
    needs: platforms
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Signing rights belong to this job alone, not to every job added later.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync locked dependencies
        run: uv sync --frozen --group dev

      - name: Require the tag to name the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cat VERSION)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match VERSION $version; tag v$version instead" >&2
            exit 1
          fi

      - name: Require clean tree
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "dirty working tree; refusing release packaging" >&2
            exit 1
          fi

      - name: Validate release candidate before attestation
        run: uv run python tooling/check_all.py --ci

      - name: Build skill packages
        run: |
          mkdir -p dist
          for skill in skills/*/SKILL.md; do
            id="$(basename "$(dirname "$skill")")"
            uv run python tooling/package_skill.py "$id"
          done

      # CycloneDX 1.6: every shipped skill with the SHA-256 of its skill.zip, and
      # the optional runtime libraries skills declare. Schema-validated before
      # it is written; deterministic for a given commit.
      - name: Write the plugin SBOM
        run: uv run python tooling/sbom.py --dist dist --output dist/agent-skills.cdx.json

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: "dist/**/skill.zip"

      - name: Attest the SBOM for every package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: "dist/*/*/skill.zip"
          sbom-path: dist/agent-skills.cdx.json

      - name: Upload packages and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-skills-packages
          path: |
            dist/agent-skills.cdx.json
            dist/*/*/skill.zip
            dist/*/*/skill.zip.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Prepare versioned assets from the attested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh run download "$RUN_ID" --name agent-skills-packages --dir downloaded
          mkdir assets
          cp downloaded/agent-skills.cdx.json assets/
          for package in downloaded/*/*/skill.zip; do
            (cd "$(dirname "$package")" && sha256sum -c skill.zip.sha256)
            version="$(basename "$(dirname "$package")")"
            skill="$(basename "$(dirname "$(dirname "$package")")")"
            cp "$package" "assets/$skill-$version.zip"
          done
          printf '%s\n' "$SOURCE_SHA" > assets/SOURCE_COMMIT
          (cd assets && sha256sum ./*.zip agent-skills.cdx.json SOURCE_COMMIT > SHA256SUMS)
      - name: Create a draft release for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* --verify-tag --draft --title "$TAG" \
            --notes "Attested skill packages, SHA-256 checksums and CycloneDX SBOM. Package and deterministic checks do not establish model effectiveness."
