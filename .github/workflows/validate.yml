name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync locked dependencies
        run: uv sync --frozen --group dev

      # Every gate lives in tooling/check_all.py, the same list contributors run
      # locally; tooling/tests/test_check_all.py fails if a gate step is added
      # here instead. Each gate's output is folded into its own log group.
      - name: Repository gates
        run: uv run python tooling/check_all.py --ci
