name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: python3 -m ruff check .

      - name: Registry and repo integrity
        run: |
          python3 tooling/validate_repo.py
          python3 tooling/sync_orchestrator.py --check

      - name: Host compatibility
        run: python3 tooling/compatibility.py

      - name: Generated adapters check
        run: python3 tooling/generate_adapters.py --check

      - name: Context budget
        run: python3 tooling/context_budget.py --check

      - name: Routing evals
        run: python3 tooling/run_routing_evals.py

      - name: Eval strength
        run: python3 tooling/eval_strength.py --check

      - name: Behavior fixtures
        run: |
          python3 tooling/run_behavior_evals.py
          python3 tooling/run_blind_eval_harness.py --write-report

      - name: CW-AIP envelope validator
        run: |
          python3 tooling/validate_envelope.py fixtures/cwaip-v2/evidence-final.json --final
          python3 -c '
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tooling")
          from validate_envelope import validate_envelope
          data = json.loads(Path("fixtures/cwaip-v2/evidence-final.json").read_text())
          data["payload_hash"] = "pending"
          try:
              validate_envelope(data, final=True)
          except ValueError:
              print("OK: --final rejects pending")
          else:
              raise SystemExit("FAIL: pending accepted under --final")
          '

      - name: Public safety scan
        run: python3 tooling/public_safety.py --root .

      - name: Compile Python modules
        run: |
          find skills tooling -name '*.py' -print0 | xargs -0 python3 -m py_compile

      - name: Unit tests
        run: |
          if ! command -v python >/dev/null; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python
          fi
          python3 -m pytest -q tooling/tests skills/*/tests
