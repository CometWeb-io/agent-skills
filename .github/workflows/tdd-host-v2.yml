name: TDD Host v2

on:
  pull_request:
    branches: [main]

jobs:
  host-v2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Host v2 contract
        run: python3 -m pytest -q tooling/tests/test_host_compatibility_v2.py
