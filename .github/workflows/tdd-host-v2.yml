name: TDD Cross Runtime

on:
  pull_request:
    branches: [main]

jobs:
  cross-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Cross-runtime contracts
        run: |
          python3 -m pytest -q \
            tooling/tests/test_host_compatibility_v2.py \
            tooling/tests/test_generate_adapters_v2.py
