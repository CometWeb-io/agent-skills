name: Knowledge freshness report

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Report recorded knowledge TTL and affected dependents
        env:
          REPORT_PATH: ${{ runner.temp }}/knowledge-freshness.json
        run: python3 tooling/check_knowledge.py registry/knowledge-rules.json > "$REPORT_PATH"
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-freshness-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knowledge-freshness.json
          if-no-files-found: error
          retention-days: 30
