name: Platform matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: platform-matrix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-tooling:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    name: ${{ matrix.os }} / py${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # Native evidence must describe the reviewed head, not a synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync locked dependencies
        run: uv sync --frozen --group dev

      - name: Run portable tooling contracts
        run: >-
          uv run pytest -q
          tooling/tests/test_routing_lexical.py
          tooling/tests/test_routing_coverage.py
          tooling/tests/test_routing_holdout.py
          tooling/tests/test_grade_output.py
          tooling/tests/test_behavior_suites.py
          tooling/tests/test_supply_chain.py
          tooling/tests/test_hashing_is_reproducible.py
          tooling/tests/test_windows_portability.py
          tooling/tests/test_audit_readiness.py
          tooling/tests/test_frontmatter_host_matrix.py
          tooling/tests/test_host_migration.py
          tooling/tests/test_context_budget.py
          skills/skill-orchestrator/tests/test_workflow_ledger.py
          tooling/tests/test_ledger_concurrency.py

      - name: Collect native platform evidence
        shell: bash
        env:
          NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/native-tests
        run: uv run --frozen python tooling/platform_evidence.py --trusted-checkout --output "$NATIVE_EVIDENCE_DIR"

      - name: Upload native platform evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-tests-${{ matrix.os }}-py${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-tests/
          if-no-files-found: error
          retention-days: 30
